name: Build Windows EXE

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller pyside6

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item $exe.FullName bundle/ffmpeg.exe

      - name: Build EXE
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MP3Compressor
          --exclude-module PyQt5 --exclude-module tkinter
          --exclude-module numpy --exclude-module PIL
          gui.py

      - name: Package release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MP3Compressor.exe release/
          Copy-Item bundle/ffmpeg.exe release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath MP3Compressor-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP3Compressor-windows-x64
          path: MP3Compressor-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MP3Compressor-windows-x64.zip
